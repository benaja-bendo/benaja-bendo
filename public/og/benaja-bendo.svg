<!--
  Source de la carte Open Graph. Le fichier SERVI est le PNG à côté : aucune
  plateforme (LinkedIn, X, Slack, Facebook) n'accepte un SVG en og:image.
  Après toute modification de ce fichier, régénérer le PNG — sinon la correction
  ne part pas en ligne :

    node -e "import('./node_modules/sharp/dist/index.mjs').then(async m => {
      await m.default(require('fs').readFileSync('public/og/benaja-bendo.svg'), { density: 144 })
        .resize(1200, 630, { fit: 'fill' }).png({ compressionLevel: 9 })
        .toFile('public/og/benaja-bendo.png');
    })"

  sharp arrive avec Astro : rien à installer, rien à ajouter au package.json.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fcfaf3"/>
  <rect x="42" y="42" width="1100" height="530" rx="24" fill="#ffffff" stroke="#16212b" stroke-width="4"/>
  <path d="M42 124h1100" stroke="#16212b" stroke-width="4"/>
  <g fill="#0e7c66">
    <rect x="42" y="42" width="12" height="80"/><rect x="66" y="42" width="12" height="80"/>
    <rect x="90" y="42" width="12" height="80"/><rect x="114" y="42" width="12" height="80"/>
    <rect x="138" y="42" width="12" height="80"/><rect x="162" y="42" width="12" height="80"/>
  </g>
  <rect x="1030" y="58" width="92" height="48" fill="#0e7c66" stroke="#16212b" stroke-width="4"/>
  <text x="1076" y="90" text-anchor="middle" fill="#fcfaf3" font-size="23" font-weight="700" font-family="ui-monospace, monospace">BB</text>

  <text x="100" y="205" fill="#5a6673" font-size="23" font-weight="700" letter-spacing="3" font-family="ui-monospace, monospace">BORDEAUX · DÉVELOPPEUR FULLSTACK</text>
  <text x="100" y="298" fill="#16212b" font-size="64" font-weight="700" font-family="Arial, sans-serif">Bénaja Bendo-Matondo</text>
  <text x="100" y="360" fill="#16212b" font-size="34" font-family="Arial, sans-serif">Je construis des systèmes logiciels,</text>
  <text x="100" y="406" fill="#16212b" font-size="34" font-family="Arial, sans-serif">et je les fais tenir en production.</text>

  <!-- Le surligneur mesurait 604 px pour un texte qui en fait ~626 : « apprentissages »
       sortait de l'aplat sur le PNG servi. La largeur du texte est maintenant
       épinglée par `textLength` (ajustement sur les espaces, pas sur les glyphes),
       et l'aplat garde 26 px de gouttière de chaque côté : 26 + 604 + 26 = 656.
       Le rendu ne dépend donc plus de la police que l'outil de conversion résout. -->
  <rect x="100" y="468" width="656" height="56" rx="10" fill="#a9e5d3"/>
  <text x="126" y="505" fill="#16212b" font-size="25" font-weight="700" font-family="ui-monospace, monospace" textLength="604" lengthAdjust="spacing">réalisations · décisions · apprentissages</text>

  <g transform="translate(872 213)" shape-rendering="crispEdges">
    <rect width="170" height="170" fill="#0e7c66" stroke="#16212b" stroke-width="6"/>
    <g fill="#fcfaf3">
      <rect x="40" y="36" width="24" height="98"/>
      <rect x="64" y="36" width="54" height="22"/>
      <rect x="64" y="74" width="54" height="22"/>
      <rect x="64" y="112" width="54" height="22"/>
      <rect x="118" y="58" width="22" height="22"/>
      <rect x="118" y="96" width="22" height="22"/>
    </g>
    <rect x="142" y="142" width="28" height="28" fill="#b9700a"/>
  </g>
  <rect x="890" y="407" width="170" height="16" fill="#0e7c66"/>
  <rect x="910" y="423" width="170" height="16" fill="#b9700a"/>
  <text x="100" y="555" fill="#5a6673" font-size="22" font-family="ui-monospace, monospace">benaja-bendo.fr</text>
</svg>
