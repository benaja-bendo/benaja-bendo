# En-têtes de sécurité pour benaja-bendo.fr — Apache 2.4 (mod_headers).
#
# À inclure dans le VirtualHost HTTPS qui sert le dossier `dist/`.
# Activer le module au préalable :  a2enmod headers && systemctl reload apache2
#
# Cible : note A/A+ sur https://developer.mozilla.org/observatory et
# https://securityheaders.com. À valider après chaque changement.

<IfModule mod_headers.c>
  Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
  Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()"
  Header always set X-Frame-Options "DENY"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set Cross-Origin-Resource-Policy "same-origin"
</IfModule>

# Note : n'ajouter « preload » à Strict-Transport-Security qu'une fois certain
# de rester en HTTPS sur tous les sous-domaines (l'inscription est difficile à
# annuler). Traefik : traduire ces en-têtes en labels middleware `headers`.
