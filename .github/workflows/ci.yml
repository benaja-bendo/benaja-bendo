name: CI & Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jeton en lecture seule par défaut (élever au job près si un déploiement en a besoin).
permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par empreinte de commit (référence immuable) — cf. audit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install (dépendances verrouillées)
        run: npm ci

      - name: Type-check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      # Les aperçus Firebase sont réservés aux branches de ce dépôt : les secrets
      # GitHub ne sont volontairement pas exposés aux forks ni à Dependabot.
      - name: Deploy preview to Firebase Hosting
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BENAJA_BENDO }}
          projectId: benaja-bendo
          expires: 7d
          firebaseToolsVersion: 15.26.0

      - name: Deploy live to Firebase Hosting
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BENAJA_BENDO }}
          projectId: benaja-bendo
          channelId: live
          firebaseToolsVersion: 15.26.0
