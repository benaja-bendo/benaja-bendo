version: 2
updates:
  # Dépendances npm (Astro + intégrations)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"

  # Actions GitHub (met à jour les empreintes de commit épinglées)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
